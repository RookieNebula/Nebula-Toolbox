<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-accent="indigo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#eef2f7">
<title>决策抽签</title>
<style>
  :root{
    --bg:#eef2f7;--ink:#0f172a;--muted:#64748b;--faint:#94a3b8;
    --panel:rgba(255,255,255,.76);--panel2:rgba(255,255,255,.5);--solid:#fff;
    --line:rgba(255,255,255,.9);--hair:rgba(15,23,42,.07);
    --shadow:0 16px 36px -14px rgba(31,38,135,.3);--shadow-sm:0 6px 16px -8px rgba(31,38,135,.24);
    --accent:#6366f1;--accent2:#8b5cf6;--soft:rgba(99,102,241,.13);
    --bad:#ef4444;--ok:#10b981;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  html[data-theme="dark"]{
    --bg:#080b14;--ink:#e8ebf5;--muted:#93a0b8;--faint:#6b7891;
    --panel:rgba(24,30,47,.82);--panel2:rgba(18,24,39,.62);--solid:#141a2b;
    --line:rgba(255,255,255,.07);--hair:rgba(255,255,255,.07);
    --shadow:0 18px 40px -16px rgba(0,0,0,.78);--shadow-sm:0 8px 18px -10px rgba(0,0,0,.6);
    --soft:rgba(99,102,241,.2);
  }
  html[data-accent="mint"]{--accent:#10b981;--accent2:#06b6d4;--soft:rgba(16,185,129,.14);}
  html[data-accent="sunset"]{--accent:#f97316;--accent2:#ef4444;--soft:rgba(249,115,22,.14);}
  html[data-accent="sakura"]{--accent:#ec4899;--accent2:#a855f7;--soft:rgba(236,72,153,.14);}
  html[data-accent="graphite"]{--accent:#64748b;--accent2:#334155;--soft:rgba(100,116,139,.16);}
  html[data-theme="dark"][data-accent="mint"]{--soft:rgba(16,185,129,.22);}
  html[data-theme="dark"][data-accent="sunset"]{--soft:rgba(249,115,22,.22);}
  html[data-theme="dark"][data-accent="sakura"]{--soft:rgba(236,72,153,.22);}
  html[data-theme="dark"][data-accent="graphite"]{--soft:rgba(148,163,184,.2);}

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;min-height:100vh;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background-color:var(--bg);
    background-image:radial-gradient(circle at 50% -10%,rgba(129,140,248,.22),transparent 58%),url('bg.jpg');
    background-size:cover;background-position:center;background-attachment:fixed;
    padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));}
  html[data-theme="dark"] body{background-image:radial-gradient(circle at 50% -10%,rgba(99,102,241,.25),transparent 58%),linear-gradient(rgba(6,9,18,.86),rgba(6,9,18,.94)),url('bg.jpg');}
  h1{font-size:19px;margin:0 0 3px;font-weight:800;}
  .sub{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:14px;}

  .tabs{display:flex;gap:7px;margin-bottom:12px;}
  .tab{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-family:inherit;
    font-size:12px;font-weight:800;padding:9px;border-radius:12px;cursor:pointer;transition:.2s var(--ease);}
  .tab.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;}
  .tab:active{transform:scale(.96);}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;
    box-shadow:var(--shadow);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);}
  .card-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:800;margin-bottom:10px;}
  .card-title em{font-style:normal;font-size:10.5px;font-weight:700;color:var(--muted);}
  textarea,input,select{width:100%;border:1px solid var(--hair);background:var(--panel2);border-radius:12px;
    padding:11px;font-family:inherit;font-size:12.5px;color:var(--ink);outline:none;line-height:1.6;}
  textarea{min-height:110px;resize:vertical;}
  textarea:focus,input:focus,select:focus{border-color:var(--accent);background:var(--solid);}
  .row{display:flex;gap:8px;align-items:center;}
  .row > *{flex:1;min-width:0;}
  .row > button{flex:none;}
  .btns{display:flex;gap:8px;margin-top:10px;}
  button{font-family:inherit;font-size:12px;font-weight:800;padding:10px 13px;border-radius:11px;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);cursor:pointer;transition:.18s var(--ease);flex:1;}
  button:active{transform:scale(.96);}
  button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;
    box-shadow:0 6px 16px -8px var(--accent);}
  button.ghost{color:var(--muted);}
  button:disabled{opacity:.55;}

  /* 转盘 */
  .wheel-wrap{position:relative;width:230px;height:230px;margin:6px auto 14px;}
  .pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;
    border-left:10px solid transparent;border-right:10px solid transparent;border-top:18px solid var(--accent);
    z-index:3;filter:drop-shadow(0 3px 5px rgba(0,0,0,.22));}
  .wheel{width:100%;height:100%;border-radius:50%;position:relative;box-shadow:0 14px 34px -12px rgba(31,38,135,.4);
    border:5px solid var(--solid);transition:transform 3.1s cubic-bezier(.17,.67,.14,1);}
  .wheel::after{content:'';position:absolute;inset:38%;border-radius:50%;background:var(--solid);
    box-shadow:inset 0 2px 8px rgba(0,0,0,.1);}
  .hub{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;
    font-size:12px;font-weight:900;color:var(--accent);pointer-events:none;}
  .result{text-align:center;font-size:17px;font-weight:900;min-height:26px;color:var(--accent);
    transition:.25s var(--ease);}
  .legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;}
  .lg{font-size:10.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:5px;
    background:var(--panel2);padding:4px 8px;border-radius:7px;border:1px solid var(--line);max-width:46%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lg i{width:8px;height:8px;border-radius:2px;flex:none;}
  .hist{margin-top:12px;font-size:11px;font-weight:700;color:var(--muted);line-height:1.8;}
  .hist span{display:inline-block;background:var(--soft);color:var(--accent);padding:3px 9px;border-radius:7px;
    margin:0 5px 5px 0;font-size:10.5px;}
  .out{margin-top:10px;background:var(--panel2);border:1px dashed var(--line);border-radius:12px;padding:12px;
    font-family:ui-monospace,Menlo,monospace;font-size:12.5px;word-break:break-all;min-height:46px;color:var(--ink);}
  .out:empty::before{content:'结果会显示在这里';color:var(--faint);font-family:inherit;}
  .hint{font-size:10.5px;line-height:1.6;color:var(--muted);font-weight:600;margin-top:8px;}
  .panel{display:none;}
  .panel.show{display:block;}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}
</style>
<link rel="stylesheet" href="tool-skin.css">
</head>
<body class="legacy-tool">

<h1>决策抽签</h1>
<div class="sub">选不出来就交给转盘；顺手还有随机生成器。</div>

<div class="tabs">
  <button class="tab on" data-tab="wheel">转盘抽签</button>
  <button class="tab" data-tab="rand">随机生成</button>
</div>

<!-- 转盘 -->
<div class="panel show" id="p-wheel">
  <div class="card">
    <div class="card-title"><span>候选项</span><em id="optCount">0 个</em></div>
    <textarea id="opts" placeholder="每行一个候选项&#10;例如：&#10;吃面&#10;吃饭&#10;点外卖"></textarea>
    <div class="btns">
      <button class="primary" id="spinBtn">开始抽</button>
      <button class="ghost" id="clearBtn">清空</button>
    </div>
  </div>

  <div class="card">
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <div class="wheel" id="wheel"></div>
      <div class="hub" id="hub">点击开始</div>
    </div>
    <div class="result" id="result"></div>
    <div class="legend" id="legend"></div>
    <div class="btns" style="margin-top:10px">
      <button id="copyResult" class="ghost">复制结果</button>
      <button id="clearHist" class="ghost">清空历史</button>
    </div>
    <div class="hint">抽取结果不会重复出现，直到候选抽完为止。历史 24 小时自动清理。</div>
    <div class="hist" id="hist"></div>
  </div>
</div>

<!-- 随机 -->
<div class="panel" id="p-rand">
  <div class="card">
    <div class="card-title"><span>随机生成</span><em>使用系统随机源</em></div>
    <div class="row">
      <select id="randType">
        <option value="pwd">随机密码</option>
        <option value="num">随机整数</option>
        <option value="str">随机字符串</option>
        <option value="uuid">UUID v4</option>
      </select>
    </div>
    <div class="row" style="margin-top:8px" id="lenRow">
      <input type="number" id="randLen" value="16" min="4" max="64" placeholder="长度">
    </div>
    <div class="row" id="numRow" style="margin-top:8px;display:none">
      <input type="number" id="numMin" value="1" placeholder="最小">
      <input type="number" id="numMax" value="100" placeholder="最大">
    </div>
    <div class="row" style="margin-top:8px" id="charsetRow">
      <select id="charset">
        <option value="alnum">字母 + 数字</option>
        <option value="full">字母 + 数字 + 符号</option>
        <option value="hex">十六进制</option>
      </select>
    </div>
    <div class="btns">
      <button class="primary" id="genBtn">生成</button>
      <button id="copyGen">复制</button>
    </div>
    <div class="out" id="genOut"></div>
  </div>
</div>

<script src="lib-io.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  var COLORS = ['#6366f1', '#8b5cf6', '#06b6d4', '#10b981', '#f59e0b', '#ef4444', '#ec4899', '#64748b',
    '#0ea5e9', '#84cc16', '#f97316', '#a855f7'];
  var spinning = false;
  var wheelRot = 0;
  var lastPick = '';
  var HISTORY_KEY = 'plug_pick_hist';

  function optsList() {
    return $('opts').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
  }

  function renderWheel() {
    var list = optsList();
    $('optCount').textContent = list.length + ' 个';
    $('legend').innerHTML = list.slice(0, 24).map(function (t, i) {
      return '<span class="lg"><i style="background:' + COLORS[i % COLORS.length] + '"></i>' + IO.escape(t) + '</span>';
    }).join('');

    var wheel = $('wheel');
    if (!list.length) {
      wheel.style.background = 'var(--panel2)';
      $('hub').textContent = '还没有选项';
      return;
    }
    var n = list.length, seg = 360 / n;
    var stops = list.map(function (t, i) {
      var c = COLORS[i % COLORS.length];
      return c + ' ' + (i * seg).toFixed(2) + 'deg ' + ((i + 1) * seg).toFixed(2) + 'deg';
    });
    // 每段之间加一条细分隔线
    var parts = [];
    list.forEach(function (t, i) {
      var c = COLORS[i % COLORS.length];
      parts.push(c + ' ' + (i * seg).toFixed(2) + 'deg ' + ((i + 1) * seg - 0.4).toFixed(2) + 'deg');
      parts.push('rgba(255,255,255,.85) ' + ((i + 1) * seg - 0.4).toFixed(2) + 'deg ' + ((i + 1) * seg).toFixed(2) + 'deg');
    });
    wheel.style.background = 'conic-gradient(' + parts.join(',') + ')';
    $('hub').textContent = n + ' 选 1';
    wheelRot = 0;
    wheel.style.transform = 'rotate(0deg)';
  }

  function rndInt(max) {
    if (window.crypto && window.crypto.getRandomValues) {
      var a = new Uint32Array(1);
      window.crypto.getRandomValues(a);
      return a[0] % max;
    }
    return Math.floor(Math.random() * max);
  }

  function spin() {
    if (spinning) return;
    var list = optsList();
    if (list.length < 2) { IO.toast('至少写两个候选项', 'err'); return; }

    // 不重复：优先从没抽过的里选
    var used = IO.get('plug_pick_used', []);
    if (!Array.isArray(used)) used = [];
    var pool = list.filter(function (t) { return used.indexOf(t) < 0; });
    if (!pool.length) { used = []; pool = list; }
    var pick = pool[rndInt(pool.length)];

    spinning = true;
    $('spinBtn').disabled = true;
    $('result').textContent = '……';
    $('hub').textContent = '转动中';

    var idx = list.indexOf(pick);
    var seg = 360 / list.length;
    // 多转 5 圈，并让选中扇形中心停在顶部指针处
    var target = 360 * 5 - (idx + 0.5) * seg;
    wheelRot += target;
    $('wheel').style.transform = 'rotate(' + wheelRot + 'deg)';

    setTimeout(function () {
      spinning = false;
      $('spinBtn').disabled = false;
      $('hub').textContent = list.length + ' 选 1';
      lastPick = pick;
      $('result').textContent = '🎯 ' + pick;
      used.push(pick);
      IO.set('plug_pick_used', used);

      var hist = IO.get(HISTORY_KEY, []);
      if (!Array.isArray(hist)) hist = [];
      hist.unshift({ text: pick, ts: Date.now() });
      IO.set(HISTORY_KEY, hist.slice(0, 12));
      renderHist();
      IO.toast('结果：' + pick, 'ok');
    }, 3250);
  }

  function renderHist() {
    var hist = IO.get(HISTORY_KEY, []);
    if (!Array.isArray(hist)) hist = [];
    var cutoff = Date.now() - 864e5;
    hist = hist.filter(function (h) { return h && h.ts >= cutoff; });
    $('hist').innerHTML = hist.length
      ? '最近：' + hist.slice(0, 8).map(function (h) { return '<span>' + IO.escape(h.text) + '</span>'; }).join('')
      : '';
  }

  $('opts').addEventListener('input', IO.debounce(function () {
    renderWheel();
    IO.set('plug_pick_opts', $('opts').value);
  }, 260));
  $('spinBtn').addEventListener('click', spin);
  $('clearBtn').addEventListener('click', function () {
    $('opts').value = '';
    IO.del('plug_pick_opts'); IO.del('plug_pick_used');
    renderWheel(); $('result').textContent = '';
    IO.clearFx('清空成功', '选项已移除');
  });
  $('copyResult').addEventListener('click', function () {
    if (!lastPick) return IO.toast('还没有结果', 'err');
    IO.copy(lastPick).then(function (ok) { IO.toast(ok ? '已复制' : '复制失败', ok ? 'ok' : 'err'); });
  });
  $('clearHist').addEventListener('click', function () {
    IO.clearPrefix('plug_pick_hist'); IO.clearPrefix('plug_pick_used');
    renderHist(); IO.clearFx('清空成功', '历史已移除');
  });

  /* ---------------- 随机生成 ---------------- */
  function randStr(pool, len) {
    var out = '';
    for (var i = 0; i < len; i++) out += pool[rndInt(pool.length)];
    return out;
  }
  function gen() {
    var type = $('randType').value;
    var out = '';
    if (type === 'pwd') {
      var len = Math.max(4, Math.min(64, parseInt($('randLen').value, 10) || 16));
      var cs = $('charset').value;
      var base = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      if (cs === 'full') base += '!@#$%^&*()-_=+[]{};:,.?';
      if (cs === 'hex') base = '0123456789abcdef';
      out = randStr(base, len);
    } else if (type === 'num') {
      var min = parseInt($('numMin').value, 10), max = parseInt($('numMax').value, 10);
      if (isNaN(min)) min = 1;
      if (isNaN(max)) max = 100;
      if (max < min) { var t = min; min = max; max = t; }
      out = String(min + rndInt(max - min + 1));
    } else if (type === 'str') {
      var l2 = Math.max(4, Math.min(64, parseInt($('randLen').value, 10) || 12));
      out = randStr('abcdefghijklmnopqrstuvwxyz0123456789', l2);
    } else {
      out = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
        var r = rndInt(16);
        var v = c === 'x' ? r : ((r & 3) | 8);
        return v.toString(16);
      });
    }
    $('genOut').textContent = out;
    IO.toast('已生成', 'ok');
  }
  $('genBtn').addEventListener('click', gen);
  $('copyGen').addEventListener('click', function () {
    var t = $('genOut').textContent;
    if (!t) return IO.toast('先点生成', 'err');
    IO.copy(t).then(function (ok) { IO.toast(ok ? '已复制' : '复制失败', ok ? 'ok' : 'err'); });
  });
  $('randType').addEventListener('change', function () {
    var t = this.value;
    $('lenRow').style.display = (t === 'pwd' || t === 'str') ? 'flex' : 'none';
    $('charsetRow').style.display = t === 'pwd' ? 'flex' : 'none';
    $('numRow').style.display = t === 'num' ? 'flex' : 'none';
  });
  $('randType').dispatchEvent(new Event('change'));

  /* ---------------- Tab ---------------- */
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
    b.addEventListener('click', function () {
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (x) { x.classList.toggle('on', x === b); });
      Array.prototype.forEach.call(document.querySelectorAll('.panel'), function (p) {
        p.classList.toggle('show', p.id === 'p-' + b.getAttribute('data-tab'));
      });
    });
  });

  /* ---------------- 启动 ---------------- */
  var saved = IO.get('plug_pick_opts', '');
  if (typeof saved === 'string' && saved.trim()) $('opts').value = saved;
  else $('opts').value = '吃面\n吃饭\n点外卖';
  renderWheel();
  renderHist();
})();
</script>
<script src="tool-skin.js"></script>
<script src="v9-upgrade.js"></script>
</body>
</html>
