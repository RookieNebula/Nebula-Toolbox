<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-accent="indigo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#eef2f7">
<title>文本对比</title>
<style>
  :root{
    --bg:#eef2f7;--ink:#0f172a;--muted:#64748b;--faint:#94a3b8;
    --panel:rgba(255,255,255,.76);--panel2:rgba(255,255,255,.5);--solid:#fff;
    --line:rgba(255,255,255,.9);--hair:rgba(15,23,42,.07);
    --shadow:0 16px 36px -14px rgba(31,38,135,.3);--shadow-sm:0 6px 16px -8px rgba(31,38,135,.24);
    --accent:#6366f1;--accent2:#8b5cf6;--soft:rgba(99,102,241,.13);
    --add:#10b981;--del:#ef4444;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  html[data-theme="dark"]{
    --bg:#080b14;--ink:#e8ebf5;--muted:#93a0b8;--faint:#6b7891;
    --panel:rgba(24,30,47,.82);--panel2:rgba(18,24,39,.62);--solid:#141a2b;
    --line:rgba(255,255,255,.07);--hair:rgba(255,255,255,.07);
    --shadow:0 18px 40px -16px rgba(0,0,0,.78);--shadow-sm:0 8px 18px -10px rgba(0,0,0,.6);
    --soft:rgba(99,102,241,.2);
  }
  html[data-accent="mint"]{--accent:#10b981;--accent2:#06b6d4;--soft:rgba(16,185,129,.14);}
  html[data-accent="sunset"]{--accent:#f97316;--accent2:#ef4444;--soft:rgba(249,115,22,.14);}
  html[data-accent="sakura"]{--accent:#ec4899;--accent2:#a855f7;--soft:rgba(236,72,153,.14);}
  html[data-accent="graphite"]{--accent:#64748b;--accent2:#334155;--soft:rgba(100,116,139,.16);}
  html[data-theme="dark"][data-accent="mint"]{--soft:rgba(16,185,129,.22);}
  html[data-theme="dark"][data-accent="sunset"]{--soft:rgba(249,115,22,.22);}
  html[data-theme="dark"][data-accent="sakura"]{--soft:rgba(236,72,153,.22);}
  html[data-theme="dark"][data-accent="graphite"]{--soft:rgba(148,163,184,.2);}

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;min-height:100vh;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background-color:var(--bg);
    background-image:radial-gradient(circle at 50% -10%,rgba(129,140,248,.22),transparent 58%);
    background-size:cover;background-position:center;background-attachment:fixed;
    padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));}
  html[data-theme="dark"] body{background-image:radial-gradient(circle at 50% -10%,rgba(99,102,241,.25),transparent 58%),linear-gradient(rgba(6,9,18,.86),rgba(6,9,18,.94));}
  h1{font-size:19px;margin:0 0 3px;font-weight:800;}
  .sub{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:14px;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;
    box-shadow:var(--shadow);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);}
  .card-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:800;margin-bottom:10px;}
  .card-title em{font-style:normal;font-size:10.5px;font-weight:700;color:var(--muted);}
  textarea{width:100%;min-height:130px;border:1px solid var(--hair);background:var(--panel2);border-radius:14px;
    padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.65;
    color:var(--ink);outline:none;resize:vertical;}
  textarea:focus{border-color:var(--accent);background:var(--solid);}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  button{font-family:inherit;font-size:12px;font-weight:800;padding:9px 13px;border-radius:11px;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);cursor:pointer;transition:.18s var(--ease);}
  button:active{transform:scale(.95);}
  button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;
    box-shadow:0 6px 16px -8px var(--accent);}
  button.ghost{color:var(--muted);}
  .opts{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 2px;}
  .chk{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted);}
  .chk input{width:15px;height:15px;accent-color:var(--accent);}

  .stats{display:none;gap:8px;margin:2px 0 12px;flex-wrap:wrap;}
  .stats.show{display:flex;}
  .chip{font-size:11px;font-weight:800;padding:6px 11px;border-radius:9px;background:var(--panel2);
    border:1px solid var(--line);color:var(--muted);}
  .chip b{font-weight:800;}
  .chip.add{color:var(--add);border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.1);}
  .chip.del{color:var(--del);border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.1);}

  .diff{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.6;
    max-height:60vh;overflow-y:auto;box-shadow:var(--shadow-sm);display:none;}
  .diff.show{display:block;}
  .dline{display:flex;gap:0;border-bottom:1px solid var(--hair);}
  .dline:last-child{border-bottom:none;}
  .dline .ln{width:38px;flex:none;text-align:right;padding:4px 6px;color:var(--faint);font-size:10px;
    background:var(--panel2);user-select:none;}
  .dline .sign{width:18px;flex:none;text-align:center;padding:4px 0;font-weight:800;user-select:none;}
  .dline .tx{flex:1;padding:4px 8px;white-space:pre-wrap;word-break:break-all;min-width:0;}
  .dline.add{background:rgba(16,185,129,.09);}
  .dline.add .sign{color:var(--add);}
  .dline.del{background:rgba(239,68,68,.09);}
  .dline.del .sign{color:var(--del);}
  .dline.same .sign{color:var(--faint);}
  .empty{text-align:center;padding:40px 12px;color:var(--muted);font-size:12.5px;font-weight:600;line-height:1.8;}

  @media (min-width:640px){
    .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}
</style>
<link rel="stylesheet" href="tool-skin.css">
</head>
<body class="legacy-tool">

<h1>文本对比</h1>
<div class="sub">逐行 diff · 左侧原版 / 右侧新版 · 全部本地计算</div>

<div class="pair">
  <div class="card">
    <div class="card-title"><span>左侧（原）</span><em id="lenA">0 行</em></div>
    <textarea id="taA" placeholder="粘贴原文本，或点「导入」…" spellcheck="false"></textarea>
    <div class="btns">
      <button id="impA">导入</button>
      <button class="ghost" id="clrA">清空</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title"><span>右侧（新）</span><em id="lenB">0 行</em></div>
    <textarea id="taB" placeholder="粘贴新文本，或点「导入」…" spellcheck="false"></textarea>
    <div class="btns">
      <button id="impB">导入</button>
      <button class="ghost" id="clrB">清空</button>
    </div>
  </div>
</div>

<div class="card">
  <div class="opts">
    <label class="chk"><input type="checkbox" id="optTrim" checked> 忽略行首尾空白</label>
    <label class="chk"><input type="checkbox" id="optCase"> 忽略大小写</label>
    <label class="chk"><input type="checkbox" id="optEmpty" checked> 忽略空行</label>
  </div>
  <div class="btns">
    <button class="primary" id="run">开始对比</button>
    <button id="swap">交换左右</button>
    <button id="copy">复制报告</button>
    <button class="ghost" id="export">导出报告</button>
  </div>
  <div class="stats" id="stats">
    <span class="chip add">新增 <b id="stAdd">0</b></span>
    <span class="chip del">删除 <b id="stDel">0</b></span>
    <span class="chip">相同 <b id="stSame">0</b></span>
    <span class="chip">相似度 <b id="stSim">0%</b></span>
  </div>
</div>

<div class="diff" id="diff"></div>
<div class="empty" id="emptyBox">还没有对比结果<br>填入两侧文本后点「开始对比」</div>

<input type="file" id="filePick" hidden>

<script src="lib-io.js"></script>
<script src="app-core.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  function lines(text, opt) {
    var arr = String(text || '').replace(/\r\n?/g, '\n').split('\n');
    if (opt.empty) arr = arr.filter(function (l) { return l.trim() !== ''; });
    if (opt.trim) arr = arr.map(function (l) { return l.trim(); });
    if (opt.case) arr = arr.map(function (l) { return l.toLowerCase(); });
    return arr;
  }

  /* LCS 行级 diff */
  function diffLines(a, b) {
    var n = a.length, m = b.length, W = m + 1;
    var dp = new Int32Array((n + 1) * W);
    var i, j;
    for (i = n - 1; i >= 0; i--) {
      for (j = m - 1; j >= 0; j--) {
        dp[i * W + j] = (a[i] === b[j])
          ? dp[(i + 1) * W + j + 1] + 1
          : Math.max(dp[(i + 1) * W + j], dp[i * W + j + 1]);
      }
    }
    var out = [], ai = 0, bi = 0;
    while (ai < n && bi < m) {
      if (a[ai] === b[bi]) { out.push({ t: 'same', a: a[ai], b: b[bi], ai: ai, bi: bi }); ai++; bi++; }
      else if (dp[(ai + 1) * W + bi] >= dp[ai * W + bi + 1]) { out.push({ t: 'del', a: a[ai], ai: ai }); ai++; }
      else { out.push({ t: 'add', b: b[bi], bi: bi }); bi++; }
    }
    while (ai < n) { out.push({ t: 'del', a: a[ai], ai: ai }); ai++; }
    while (bi < m) { out.push({ t: 'add', b: b[bi], bi: bi }); bi++; }
    return out;
  }

  function opts() {
    return {
      trim: $('optTrim').checked,
      case: $('optCase').checked,
      empty: $('optEmpty').checked
    };
  }

  function updateLen() {
    $('lenA').textContent = lines($('taA').value, opts()).length + ' 行';
    $('lenB').textContent = lines($('taB').value, opts()).length + ' 行';
  }

  var lastResult = null;

  function run() {
    var A = lines($('taA').value, opts());
    var B = lines($('taB').value, opts());
    if (!A.length && !B.length) { IO.toast('两侧都还没有内容', 'err'); return; }

    if (A.length * B.length > 1500000) {
      IO.toast('内容过大，已改用快速逐行对比', 'err');
      return quickCompare(A, B);
    }

    var res = diffLines(A, B);
    lastResult = res;
    var adds = 0, dels = 0, same = 0;
    var shown = res.length > 3000 ? res.slice(0, 3000) : res;
    var html = shown.map(function (r) {
      if (r.t === 'add') { adds++; return row(r.bi + 1, '+', 'add', r.b); }
      if (r.t === 'del') { dels++; return row(r.ai + 1, '-', 'del', r.a); }
      same++;
      return row(r.ai + 1, ' ', 'same', r.a);
    }).join('');

    if (res.length > shown.length) {
      html += '<div class="dline same"><span class="ln">…</span><span class="sign"> </span>' +
        '<span class="tx">还有 ' + (res.length - shown.length) + ' 行未显示（统计与导出仍包含全部内容）</span></div>';
    }
    $('diff').innerHTML = html;
    $('diff').classList.add('show');
    $('emptyBox').style.display = 'none';
    $('stats').classList.add('show');
    $('stAdd').textContent = adds;
    $('stDel').textContent = dels;
    $('stSame').textContent = same;
    var total = adds + dels + same;
    $('stSim').textContent = total ? Math.round(same / total * 100) + '%' : '0%';
    IO.toast('对比完成：+' + adds + ' / -' + dels, 'ok');
  }

  function quickCompare(A, B) {
    var max = Math.max(A.length, B.length);
    var adds = 0, dels = 0, same = 0, html = '';
    for (var i = 0; i < max; i++) {
      if (A[i] === B[i]) { same++; html += row(i + 1, ' ', 'same', A[i] === undefined ? '' : A[i]); }
      else {
        if (A[i] !== undefined) { dels++; html += row(i + 1, '-', 'del', A[i]); }
        if (B[i] !== undefined) { adds++; html += row(i + 1, '+', 'add', B[i]); }
      }
    }
    lastResult = null;
    $('diff').innerHTML = html;
    $('diff').classList.add('show');
    $('emptyBox').style.display = 'none';
    $('stats').classList.add('show');
    $('stAdd').textContent = adds;
    $('stDel').textContent = dels;
    $('stSame').textContent = same;
    $('stSim').textContent = max ? Math.round(same / max * 100) + '%' : '0%';
  }

  function row(ln, sign, cls, text) {
    return '<div class="dline ' + cls + '"><span class="ln">' + ln + '</span>' +
      '<span class="sign">' + sign + '</span><span class="tx">' + IO.escape(text == null ? '' : text) + '</span></div>';
  }

  function buildReport() {
    if (!lastResult) return null;
    var out = ['--- 左侧（原）', '+++ 右侧（新）', ''];
    lastResult.forEach(function (r) {
      if (r.t === 'same') out.push('  ' + r.a);
      else if (r.t === 'del') out.push('- ' + r.a);
      else out.push('+ ' + r.b);
    });
    return out.join('\n');
  }

  /* 文件导入（记住文件名，导出时可覆盖） */
  var pickTarget = null;
  function importInto(target) {
    pickTarget = target;
    if (window.NB && NB.upload) {
      NB.upload({
        accept: '.txt,.csv,.log,.tsv,text/plain,text/csv',
        onText: function (text, file) {
          if (pickTarget === 'A') $('taA').value = text;
          else $('taB').value = text;
          updateLen();
          IO.toast('已导入 ' + file.name);
        }
      });
    } else { $('filePick').click(); }
  }
  $('filePick').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    e.target.value = '';
    IO.readFile(file).then(function (text) {
      if (pickTarget === 'A') $('taA').value = text;
      else $('taB').value = text;
      updateLen();
      if (window.NB) NB.rememberImport(file.name, null, file.size);
      IO.toast('已导入 ' + file.name);
    }).catch(function (err) { IO.toast(err.message, 'err'); });
  });
  $('impA').addEventListener('click', function () { importInto('A'); });
  $('impB').addEventListener('click', function () { importInto('B'); });
  $('clrA').addEventListener('click', function () { $('taA').value = ''; updateLen(); IO.clearFx('清空成功'); });
  $('clrB').addEventListener('click', function () { $('taB').value = ''; updateLen(); IO.clearFx('清空成功'); });

  $('run').addEventListener('click', run);
  $('swap').addEventListener('click', function () {
    var a = $('taA').value; $('taA').value = $('taB').value; $('taB').value = a;
    updateLen();
    IO.toast('已交换左右');
  });
  $('copy').addEventListener('click', function () {
    var rep = buildReport();
    if (!rep) return IO.toast('请先对比', 'err');
    IO.copy(rep).then(function (ok) { IO.toast(ok ? '报告已复制' : '复制失败', ok ? 'ok' : 'err'); });
  });
  $('export').addEventListener('click', function () {
    var rep = buildReport();
    if (!rep) return IO.toast('请先对比', 'err');
    var last = window.NB && NB.lastImport && NB.lastImport();
    NB.exportDialog({ text: rep, name: last && last.name ? NB.stripExt(last.name) : '文本对比报告', ext: 'txt', meta: '对比报告' });
  });

  ['taA', 'taB'].forEach(function (id) {
    $(id).addEventListener('input', IO.debounce(updateLen, 180));
  });
  ['optTrim', 'optCase', 'optEmpty'].forEach(function (id) {
    $(id).addEventListener('change', updateLen);
  });

  updateLen();
})();
</script>
<script src="tool-skin.js"></script>
<script src="v9-upgrade.js"></script>
</body>
</html>
