  document.querySelectorAll('#amtRow .amt').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('#amtRow .amt').forEach(function (x) { x.classList.toggle('on', x === b); });
      $('amount').value = b.getAttribute('data-a');
    });
  });

  function localSponsors() {
    try { return JSON.parse(localStorage.getItem('nb_sponsors') || '[]') || []; } catch (e) { return []; }
  }
  function saveLocal(list) {
    try { localStorage.setItem('nb_sponsors', JSON.stringify(list.slice(0, 100))); } catch (e) { }
  }

  $('spSubmit').addEventListener('click', function () {
    var amount = parseFloat($('amount').value);
    var name = $('spName').value.trim();
    var msg = $('spMsg').value.trim();
    if (!amount || amount < 1) { NB.toast('请填写有效金额'); return; }
    if (!name) { NB.toast('留个昵称吧'); $('spName').focus(); return; }
    var payload = { name: name, amount: amount, message: msg };
    var btn = this;
    btn.disabled = true;

    function done() {
      btn.disabled = false;
      $('spMsg').value = '';
      celebrate();
      NB.toast('已提交，作者确认后会出现在感谢墙');
    }
    function fail(err) {
      btn.disabled = false;
      var list = localSponsors();
      list.unshift({ name: name, amount: amount, message: msg, ts: Date.now(), status: 'local_pending' });
      saveLocal(list);
      done();
      void err;
    }

    if (!API) return fail('offline');
    fetch(API + '/api/sponsor', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(done).catch(fail);
  });

  function renderWall(list) {
    var box = $('wall');
    var approvedList = list.filter(function(x) { return x.status === 'approved' || x.status === 'local'; });
    
    if (!approvedList || !approvedList.length) {
      box.innerHTML = '<div class="preview-empty">还没有公开的赞助记录。</div>';
      return;
    }
    box.innerHTML = approvedList.slice(0, 30).map(function (x, i) {
      var n = String(x.name || '匿名');
      return '<div class="wall-item" style="animation-delay:' + Math.min(i * 40, 400) + 'ms">' +
        '<div class="wall-av">' + NB.esc(n.charAt(0)) + '</div>' +
        '<div class="wall-body"><b>' + NB.esc(n) + '</b>' +
        (x.message ? '<span>' + NB.esc(x.message) + '</span>' : '') + '</div></div>';
    }).join('');
  }

  function loadStats() {
    var local = localSponsors();
    if (!API) {
      $('wallMeta').textContent = '0 位';
      renderWall(local); 
      return;
    }
    fetch(API + '/api/stats').then(function (r) { return r.json(); }).then(function (d) {
      $('wallMeta').textContent = (d.count || 0) + ' 位';
    }).catch(function () { });
    fetch(API + '/api/sponsors?limit=30').then(function (r) { return r.json(); }).then(function (d) {
      renderWall(d.items || d.list || []);
    }).catch(function () { });
  }

  function celebrate() {
    $('thanks').classList.add('show');
    setTimeout(function () { $('thanks').classList.remove('show'); }, 1900);
    NB.haptic(14);
    if (window.confetti) {
      try {
        confetti({ particleCount: 90, spread: 70, origin: { y: 0.66 }, disableForReducedMotion: true });
        setTimeout(function () {
          confetti({ particleCount: 50, angle: 60, spread: 55, origin: { x: 0 }, disableForReducedMotion: true });
          confetti({ particleCount: 50, angle: 120, spread: 55, origin: { x: 1 }, disableForReducedMotion: true });
        }, 180);
      } catch (e) { }
    }
  }

  loadStats();
})();
