<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>行列打乱工具</title>
<style>
  :root {
    --bg-fallback: #e2e8f0;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --accent-blue: #3b82f6;
    --accent-purple: #8b5cf6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background-color: var(--bg-fallback);
    background-image: radial-gradient(circle at 50% 0%, rgba(147, 197, 253, 0.6) 0%, transparent 60%);
    background-size: cover; background-position: center; background-attachment: fixed;
    color: var(--text-main); min-height: 100vh;
    padding: 20px; padding-top: max(20px, env(safe-area-inset-top));
    display: flex; flex-direction: column; gap: 16px;
  }

  /* 统一卡片质感 */
  .card {
    background: linear-gradient(160deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.45) 100%); 
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1.5px solid rgba(255, 255, 255, 1); border-radius: 24px;
    padding: 20px; display: flex; flex-direction: column; gap: 16px;
    box-shadow: 0 18px 40px -10px rgba(31, 38, 135, 0.15), inset 0 3px 5px rgba(255, 255, 255, 1);
  }

  .top-bar {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;
  }
  .top-bar h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: 0.5px;}
  .stats { font-size: 12px; font-weight: 600; color: var(--text-muted); background: rgba(255,255,255,0.6); padding: 4px 10px; border-radius: 8px;}

  .actions-row { display: flex; gap: 10px; flex-wrap: wrap; }
  
  /* 统一按钮风格 */
  button, .btn, label.btn {
    padding: 10px 16px; border-radius: 12px; border: none;
    font-weight: 700; font-size: 13px; cursor: pointer; transition: 0.2s;
    display: inline-flex; justify-content: center; align-items: center; gap: 6px;
    background: linear-gradient(160deg, rgba(255,255,255,0.9), rgba(255,255,255,0.5)); 
    color: var(--text-main); border: 1px solid #fff; 
    box-shadow: 0 6px 15px rgba(0,0,0,0.05), inset 0 2px 3px #fff;
  }
  button:active, .btn:active { transform: scale(0.95) translateY(2px); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  
  /* 主按钮渐变 */
  .btn.primary {
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    color: white; border: none; box-shadow: 0 6px 15px rgba(59, 130, 246, 0.3), inset 0 2px 2px rgba(255,255,255,0.3);
  }
  
  .btn.danger { color: #ef4444; }
  
  /* 表单组 */
  .form-group { display: flex; flex-direction: column; gap: 8px; margin-top: 5px;}
  .form-group label { font-size: 12px; font-weight: 700; color: #475569; letter-spacing: 0.5px;}
  
  .chk-group { display: flex; flex-wrap: wrap; gap: 16px; padding: 10px 0; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-main); font-weight: 600; cursor: pointer;}
  .chk input { width: 16px; height: 16px; accent-color: var(--accent-blue); }

  input[type="text"], input[type="number"], select, textarea {
    width: 100%; background: rgba(255,255,255,0.7);
    border: 1px solid rgba(255,255,255,0.8); border-radius: 14px;
    color: var(--text-main); padding: 12px 14px; font-size: 13px;
    outline: none; transition: 0.3s; box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { border-color: #fff; background: #fff; box-shadow: 0 0 15px rgba(59, 130, 246, 0.1), inset 0 2px 5px rgba(0,0,0,0.02); }

  .row { display: flex; gap: 12px; }
  .col { flex: 1; display: flex; flex-direction: column; gap: 8px; }

  textarea { height: 350px; font-family: monospace; resize: none; margin-top: 10px; line-height: 1.5;}

  .filter-row { display: flex; gap: 8px; align-items: center; }
  .filter-row select { flex: 0 0 80px; padding: 10px;}
  .filter-row input[type="text"] { flex: 1; padding: 10px;}
  .filter-row input[type="number"] { flex: 0 0 60px; padding: 10px;}

  .preview { font-size: 12px; font-weight: 700; color: var(--accent-blue); }
</style>
<link rel="stylesheet" href="tool-skin.css">
</head>
<body class="legacy-tool">

<div class="card">
  <div class="top-bar">
    <h2>行列打乱工具</h2>
    <div class="stats" id="stats">行数 0 · 字符 0</div>
  </div>

  <div class="actions-row">
    <label class="btn primary" id="importBtn" for="fileInput" style="flex: 1;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      导入文档
    </label>
    <input type="file" id="fileInput" accept=".txt,.csv,.log,.text,text/*" hidden>
    
    <select id="encoding" style="flex: 0 0 90px; padding: 10px;">
      <option value="utf-8">UTF-8</option>
      <option value="gbk">GBK</option>
    </select>
  </div>

  <div class="actions-row">
    <button class="btn" id="btnExport" style="flex:1;">导出</button>
    <button class="btn" id="btnCopy" style="flex:1;">复制</button>
    <button class="btn" id="btnUndo" disabled style="flex:1;">撤销</button>
    <button class="btn danger" id="btnClear" style="flex:1;">清空</button>
  </div>
</div>

<div class="card">
  <div class="form-group">
    <label>打乱方式</label>
    <div class="chk-group">
      <label class="chk"><input type="checkbox" id="chkRows" checked> 打乱行顺序</label>
      <label class="chk"><input type="checkbox" id="chkCols" checked> 打乱行内列顺序</label>
      <label class="chk"><input type="checkbox" id="chkColVals"> 打乱整列</label>
      <label class="chk"><input type="checkbox" id="chkSkipEmpty" checked> 跳过空行</label>
    </div>
  </div>

  <div class="row">
    <div class="col">
      <label style="font-size:12px; font-weight:700; color:#475569;">列分隔符</label>
      <input type="text" id="delimiter" value="-" placeholder="如 - , \t">
    </div>
    <div class="col">
      <label style="font-size:12px; font-weight:700; color:#475569;">随机种子</label>
      <input type="text" id="seed" placeholder="留空 = 每次随机">
    </div>
  </div>

  <div class="form-group">
    <label>筛选（只有命中的行参与打乱）</label>
    <div class="filter-row">
      <select id="filterMode">
        <option value="contains">包含</option>
        <option value="notcontains">不包含</option>
        <option value="equals">等于</option>
        <option value="regex">正则</option>
      </select>
      <input type="text" id="filterKeyword" placeholder="关键字，留空 = 全部">
      <input type="number" id="filterCol" min="0" value="0" title="列号">
    </div>
    <div class="preview" id="filterPreview">命中 0 行</div>
  </div>

  <button class="btn primary" id="btnShuffle" style="padding: 14px; font-size: 15px; margin-top: 5px;">🎲 开始打乱</button>
</div>

<div class="card" style="flex: 1;">
  <textarea id="editor" spellcheck="false" placeholder="点击「导入文档」导入文件，或直接在此粘贴 / 编辑文本…" style="height: 100%; min-height: 250px;"></textarea>
</div>

<div id="toast">提示信息</div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const editor = $('editor'), statsEl = $('stats'), filterPreview = $('filterPreview'), delimiterInput = $('delimiter'), seedInput = $('seed'), chkRows = $('chkRows'), chkCols = $('chkCols'), chkColVals = $('chkColVals'), chkSkipEmpty = $('chkSkipEmpty'), filterMode = $('filterMode'), filterKeyword = $('filterKeyword'), filterCol = $('filterCol'), btnUndo = $('btnUndo'), btnShuffle = $('btnShuffle'), btnExport = $('btnExport'), btnCopy = $('btnCopy'), btnClear = $('btnClear'), fileInput = $('fileInput'), encodingSel = $('encoding');
  const undoStack = []; let toastTimer = null; let statsTimer = null;
  
  function normalizeNewlines(s) { return String(s).replace(/\r\n?/g, '\n'); }
  function splitLines(text) { if (!text) return []; const body = text.endsWith('\n') ? text.slice(0, -1) : text; return body === '' ? [] : body.split('\n'); }
  function parseDelimiter(raw) { if (!raw) return null; return raw.replace(/\\t/gi, '\t').replace(/\\n/gi, '\n'); }
  function shuffleArray(arr, rng) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; }
  function makeRng(seedStr) { if (!seedStr) return Math.random; let h = 2166136261 >>> 0; for (let i = 0; i < seedStr.length; i++) { h ^= seedStr.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } let a = h >>> 0; return function () { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function toast(msg) { let el = $('toast'); el.textContent = msg; el.style.opacity = '1'; el.style.transform = 'translate(-50%, 0)'; clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.style.opacity = '0'; el.style.transform = 'translate(-50%, 20px)'; }, 2000); }
  function getConfig() { return { delim: parseDelimiter(delimiterInput.value), kw: filterKeyword.value, mode: filterMode.value, colIdx: Math.max(0, parseInt(filterCol.value, 10) || 0), skipEmpty: chkSkipEmpty.checked }; }
  function buildRegex(cfg) { if (cfg.mode !== 'regex' || cfg.kw === '') return null; try { return new RegExp(cfg.kw); } catch (e) { return undefined; } }
  
  function matchLine(line, cfg, regex) {
    if (cfg.skipEmpty && line.trim() === '') return false; if (cfg.kw === '') return true;
    let target; if (cfg.colIdx > 0) { if (!cfg.delim) return false; const parts = line.split(cfg.delim); if (cfg.colIdx > parts.length) return false; target = parts[cfg.colIdx - 1]; } else { target = line; }
    switch (cfg.mode) { case 'contains': return target.indexOf(cfg.kw) !== -1; case 'notcontains': return target.indexOf(cfg.kw) === -1; case 'equals': return target === cfg.kw; case 'regex': return regex ? regex.test(target) : true; default: return true; }
  }
  
  function updateStats() {
    const text = editor.value, lines = splitLines(text), delim = parseDelimiter(delimiterInput.value); let maxCols = 0;
    if (delim) { for (let i = 0; i < lines.length; i++) { const l = lines[i]; if (l === '') continue; const n = l.split(delim).length; if (n > maxCols) maxCols = n; } }
    let s = '行数 ' + lines.length + ' · 字符 ' + text.length; if (delim && maxCols > 0) s += ' · 最多 ' + maxCols + ' 列'; statsEl.textContent = s;
  }
  
  function updateFilterPreview() {
    const cfg = getConfig(), lines = splitLines(editor.value), total = lines.length; filterPreview.style.color = '#3b82f6';
    if (total === 0) { filterPreview.textContent = '命中 0 行'; return; }
    if (cfg.colIdx > 0 && !cfg.delim) { filterPreview.textContent = '按列筛选需先填列分隔符'; filterPreview.style.color = '#ef4444'; return; }
    const regex = buildRegex(cfg); if (regex === undefined) { filterPreview.textContent = '正则表达式有误'; filterPreview.style.color = '#ef4444'; return; }
    let n = 0; for (let i = 0; i < total; i++) { if (matchLine(lines[i], cfg, regex)) n++; }
    filterPreview.textContent = '命中 ' + n + ' / ' + total + ' 行'; if (n === 0) filterPreview.style.color = '#ef4444';
  }
  
  function scheduleStats() { clearTimeout(statsTimer); statsTimer = setTimeout(function () { updateStats(); updateFilterPreview(); }, 120); }
  function pushUndo() { undoStack.push(editor.value); if (undoStack.length > 20) undoStack.shift(); btnUndo.disabled = false; btnUndo.style.opacity = '1'; }
  function doUndo() { if (undoStack.length === 0) return; editor.value = undoStack.pop(); btnUndo.disabled = undoStack.length === 0; if(btnUndo.disabled) btnUndo.style.opacity = '0.5'; updateStats(); updateFilterPreview(); toast('已撤销上次打乱'); }
  
  function doShuffle() {
    const raw = editor.value; if (!raw || raw.trim() === '') { toast('没有可打乱的内容'); return; }
    const doRows = chkRows.checked, doCols = chkCols.checked, doColVals = chkColVals.checked;
    if (!doRows && !doCols && !doColVals) { toast('请至少勾选一种打乱方式'); return; }
    const cfg = getConfig(); if ((doCols || doColVals) && !cfg.delim) { toast('打乱列需要先填写「列分隔符」'); return; }
    const regex = buildRegex(cfg); if (regex === undefined) { toast('正则格式有误'); return; }
    const hadTrailing = raw.endsWith('\n'), body = hadTrailing ? raw.slice(0, -1) : raw, lines = body === '' ? [] : body.split('\n');
    if (lines.length === 0) { toast('没有内容'); return; }
    const includeIdx = []; for (let i = 0; i < lines.length; i++) { if (matchLine(lines[i], cfg, regex)) includeIdx.push(i); }
    if (includeIdx.length === 0) { toast('没有行命中'); return; }
    const rng = makeRng(seedInput.value.trim()), newLines = lines.slice();
    if (doCols) { for (let k = 0; k < includeIdx.length; k++) { const idx = includeIdx[k], parts = newLines[idx].split(cfg.delim); if (parts.length > 1) { shuffleArray(parts, rng); newLines[idx] = parts.join(cfg.delim); } } }
    if (doColVals) {
      const rowsParts = includeIdx.map(function (idx) { return newLines[idx].split(cfg.delim); }); let maxCols = 0;
      for (let i = 0; i < rowsParts.length; i++) { if (rowsParts[i].length > maxCols) maxCols = rowsParts[i].length; }
      for (let c = 0; c < maxCols; c++) {
        const holders = []; for (let i = 0; i < rowsParts.length; i++) { if (c < rowsParts[i].length) holders.push(rowsParts[i]); }
        if (holders.length < 2) continue; const vals = holders.map(function (p) { return p[c]; }); shuffleArray(vals, rng);
        for (let i = 0; i < holders.length; i++) holders[i][c] = vals[i];
      }
      for (let k = 0; k < includeIdx.length; k++) newLines[includeIdx[k]] = rowsParts[k].join(cfg.delim);
    }
    if (doRows) { const vals = includeIdx.map(function (i) { return newLines[i]; }); shuffleArray(vals, rng); for (let k = 0; k < includeIdx.length; k++) newLines[includeIdx[k]] = vals[k]; }
    pushUndo(); editor.value = newLines.join('\n') + (hadTrailing ? '\n' : ''); updateStats(); updateFilterPreview(); toast('已打乱 ' + includeIdx.length + ' 行');
  }
  
  function handleFile(file) {
    if (!file) return; const reader = new FileReader();
    reader.onload = function (ev) {
      let text; try { const enc = encodingSel.value || 'utf-8'; text = new TextDecoder(enc).decode(ev.target.result); } catch (e) { text = new TextDecoder('utf-8').decode(ev.target.result); }
      if (window.NB && NB.rememberImport) NB.rememberImport(file.name, null, file.size);
      pushUndo(); editor.value = normalizeNewlines(text); updateStats(); updateFilterPreview(); toast('已导入：' + file.name);
    };
    reader.onerror = function () { toast('读取失败'); }; reader.readAsArrayBuffer(file);
  }
  
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  
  function exportText() {
    const text = editor.value; if (!text) { toast('没有可导出的内容'); return; }
    var last = window.NB && NB.lastImport && NB.lastImport();
    var name = last && last.name ? NB.stripExt(last.name) : '打乱结果';
    if (window.NB && NB.exportDialog) {
      NB.exportDialog({ text: text, name: name, ext: 'txt', meta: '打乱结果' });
      return;
    }
    IO.exportText(text, IO.makeName('打乱结果', 'txt'), 'text/plain', toast);
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '-9999px'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, ta.value.length);
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; } document.body.removeChild(ta); return ok;
  }
  function copyText() {
    const text = editor.value; if (!text) { toast('没有可复制的内容'); return; }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { toast('已复制到剪贴板'); }).catch(function () { const ok = fallbackCopy(text); toast(ok ? '已复制到剪贴板' : '复制失败'); });
    } else { const ok = fallbackCopy(text); toast(ok ? '已复制到剪贴板' : '复制失败'); }
  }
  function clearText() {
    if (!editor.value) { toast('已经是空的了'); return; }
    IO.confirm({
      title: '清空全部内容？',
      text: '编辑器内容会被清空，清空后仍可用「撤销」恢复。',
      okText: '清空',
      danger: true,
      onOk: function () {
        pushUndo(); editor.value = ''; updateStats(); updateFilterPreview();
        IO.clearFx('清空成功');
      }
    });
  }
  
  editor.addEventListener('input', scheduleStats); delimiterInput.addEventListener('input', scheduleStats); filterKeyword.addEventListener('input', scheduleStats); filterMode.addEventListener('change', updateFilterPreview); filterCol.addEventListener('input', scheduleStats); chkSkipEmpty.addEventListener('change', updateFilterPreview);
  btnShuffle.addEventListener('click', doShuffle); btnUndo.addEventListener('click', doUndo); btnExport.addEventListener('click', exportText); btnCopy.addEventListener('click', copyText); btnClear.addEventListener('click', clearText);
  fileInput.addEventListener('change', function (e) { const file = e.target.files && e.target.files[0]; handleFile(file); fileInput.value = ''; });
  var importBtn = document.getElementById('importBtn');
  if (importBtn && window.NB && NB.upload) {
    importBtn.addEventListener('click', function (e) {
      e.preventDefault();
      NB.upload({
        accept: '.txt,.csv,.log,.text,text/plain,text/csv',
        onText: function (text, file) {
          pushUndo(); editor.value = normalizeNewlines(text);
          updateStats(); updateFilterPreview();
          toast('已导入：' + file.name);
        }
      });
    });
  }
  updateStats(); updateFilterPreview();
  btnUndo.style.opacity = '0.5';
})();
</script>
<script src="lib-io.js"></script>
<script src="app-core.js"></script>
<script src="tool-skin.js"></script>
<script src="v9-upgrade.js"></script>
</body>
</html>
