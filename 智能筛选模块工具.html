<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能筛选模块 - 科技版</title>
<style>
  :root {
    --primary-h: 221;
    --primary-s: 83%;
    --primary-l: 53%;
    --primary: hsl(var(--primary-h), var(--primary-s), var(--primary-l));
    --primary-hover: hsl(var(--primary-h), var(--primary-s), calc(var(--primary-l) - 10%));
    --primary-light: hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.1);
    --primary-glow: hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.4);
    --bg-base: #f0f4f8;
    --bg-card: rgba(255, 255, 255, 0.75);
    --border-color: #cbd5e1;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --shadow-glow-card: 0 10px 40px -10px rgba(59, 130, 246, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.9);
    --radius-md: 10px;
    --radius-lg: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background-color: var(--bg-base);
    background-image: radial-gradient(circle at 10% 10%, rgba(59, 130, 246, 0.15) 0px, transparent 40%), radial-gradient(circle at 90% 90%, rgba(139, 92, 246, 0.1) 0px, transparent 40%);
    background-attachment: fixed; color: var(--text-main); font-size: 14px; line-height: 1.5; min-height: 100vh;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 16px 60px; }
  .hero { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; padding: 24px; background: var(--bg-card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: var(--radius-lg); box-shadow: var(--shadow-glow-card); transition: all 0.3s ease; position: relative; z-index: 10; }
  .hero-content h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: 0.5px; font-weight: 700; background: linear-gradient(to right, #1e293b, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .hero-content p { margin: 0; color: var(--text-muted); font-size: 13px; letter-spacing: 0.2px; }
  .card { background: var(--bg-card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-glow-card); transition: box-shadow 0.3s ease, border-color 0.3s ease; position: relative; }
  .main-card { border: 1px solid rgba(168, 85, 247, 0.4); box-shadow: 0 0 0 1px rgba(168, 85, 247, 0.1), 0 0 20px rgba(168, 85, 247, 0.25), 0 0 45px rgba(168, 85, 247, 0.15), var(--shadow-glow-card); }
  .main-card:hover { border-color: rgba(168, 85, 247, 0.8); box-shadow: 0 0 0 1px rgba(168, 85, 247, 0.2), 0 0 30px rgba(168, 85, 247, 0.35), 0 0 60px rgba(168, 85, 247, 0.2), var(--shadow-glow-card); }
  .card + .card { margin-top: 20px; }
  .grid { display: grid; grid-template-columns: 140px 110px 1fr 140px; gap: 16px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } .grid .grow { grid-column: auto; } }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field label { font-size: 12.5px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.3px; }
  .field input[type="text"], .field input[type="number"], textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 14px; font-family: inherit; outline: none; transition: all 0.2s ease; background: rgba(255, 255, 255, 0.6); color: var(--text-main); }
  .field input:hover, textarea:hover { background: rgba(255, 255, 255, 0.9); }
  .field input:focus, textarea:focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-light), 0 0 15px rgba(59, 130, 246, 0.2); }
  .row { display: flex; flex-wrap: wrap; gap: 12px 24px; margin-top: 16px; padding-top: 16px; border-top: 1px dashed rgba(203, 213, 225, 0.8); }
  .chk { display: inline-flex; align-items: center; gap: 8px; color: var(--text-main); cursor: pointer; user-select: none; font-size: 13.5px; transition: color 0.2s; }
  .chk:hover { color: var(--primary); }
  .chk input { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; transition: transform 0.1s; }
  .chk input:active { transform: scale(0.9); }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 20px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 18px; border-radius: var(--radius-md); border: 1px solid var(--border-color); background: #fff; color: var(--text-main); font-size: 13.5px; font-weight: 500; font-family: inherit; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); white-space: nowrap; box-shadow: var(--shadow-sm); user-select: none; }
  .btn:hover { background: #f8fafc; border-color: #94a3b8; transform: translateY(-2px); box-shadow: var(--shadow-md), 0 0 15px rgba(59, 130, 246, 0.1); }
  .btn:active { transform: translateY(0); }
  .btn.primary { background: linear-gradient(135deg, #3b82f6, #6366f1); border: none; color: #fff; font-weight: 600; box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39); }
  .btn.primary:hover { background: linear-gradient(135deg, #2563eb, #4f46e5); box-shadow: 0 6px 20px 0 rgba(59, 130, 246, 0.5); }
  .btn.ghost { color: #94a3b8; border-color: transparent; background: transparent; box-shadow: none; }
  .btn.ghost:hover { background: rgba(0,0,0,0.04); color: var(--text-main); transform: none; box-shadow: none; }
  .stat { margin-left: auto; color: var(--text-muted); font-size: 13px; }
  .stat b { font-weight: 700; }
  .msg { margin-top: 16px; padding: 12px 16px; border-radius: var(--radius-md); font-size: 13px; display: none; backdrop-filter: blur(4px); }
  .msg.err { display: block; background: rgba(254, 242, 242, 0.9); border: 1px solid #fecaca; color: #b91c1c; }
  .msg.ok  { display: block; background: rgba(240, 253, 244, 0.9); border: 1px solid #bbf7d0; color: #15803d; }
  .msg.info{ display: block; background: rgba(239, 246, 255, 0.9); border: 1px solid #bfdbfe; color: #1d4ed8; }
  .tips { margin-top: 16px; padding-top: 16px; border-top: 1px dashed rgba(203, 213, 225, 0.8); color: var(--text-muted); font-size: 13px; }
  .tips .ex { display: inline-block; margin: 4px 4px 0 0; padding: 4px 10px; border-radius: 6px; background: rgba(59, 130, 246, 0.08); color: var(--primary); cursor: pointer; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; transition: all 0.2s ease; border: 1px solid rgba(59, 130, 246, 0.2); }
  .tips .ex:hover { background: var(--primary-light); border-color: var(--primary); transform: translateY(-1px); box-shadow: 0 0 10px rgba(59,130,246,0.2); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  .cols .card { display: flex; flex-direction: column; padding: 20px; }
  .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 600; font-size: 15px; color: var(--text-main); }
  .head span:first-child { display: flex; align-items: center; gap: 8px; }
  .head svg { color: var(--primary); filter: drop-shadow(0 0 5px rgba(59, 130, 246, 0.5)); }
  .head .muted { font-weight: 500; color: var(--text-muted); font-size: 12px; }
  .stat-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; min-height: 30px; }
  .stat-chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 12px; border-radius: 6px; background: rgba(255,255,255,0.8); border: 1px solid var(--border-color); font-size: 12px; color: var(--text-muted); transition: all 0.2s; box-shadow: var(--shadow-sm); }
  .stat-chip b { font-size: 14px; color: var(--text-main); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; }
  .stat-chip.ok   { background: #ecfdf5; border-color: #a7f3d0; color: #047857; }
  .stat-chip.ok   b { color: #047857; }
  .stat-chip.info { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }
  .stat-chip.info b { color: #1d4ed8; }
  .stat-chip.warn { background: #fff7ed; border-color: #fed7aa; color: #c2410c; }
  .stat-chip.warn b { color: #c2410c; }
  .stat-chip.bad  { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
  .stat-chip.bad  b { color: #b91c1c; }
  textarea { height: 380px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.7; resize: vertical; }
  textarea[readonly] { background: rgba(248, 250, 252, 0.6); }
</style>

<body class="legacy-tool">
<div class="wrap">
  <header class="hero">
    <div class="hero-content">
      <h1>智能筛选模块</h1>
      <p>自然语言规则 → 自动编译匹配 → 命中保留 / 打码 · 其他列原样输出</p>
    </div>
  </header>
  <section class="card main-card">
    <div class="grid">
      <div class="field">
        <label>筛选列号（从 1 开始）</label>
        <input id="col" type="number" min="1" step="1" value="1">
      </div>
      <div class="field">
        <label>分隔符</label>
        <input id="delim" type="text" value="----">
      </div>
      <div class="field grow">
        <label>筛选规则</label>
        <input id="rule" type="text" value="两个字 或 阿拉伯数字" placeholder="例如：两个字 或 阿拉伯数字">
      </div>
      <div class="field">
        <label>命中列替换为</label>
        <input id="mask" type="text" value="xx">
      </div>
    </div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="useMask" checked> 启用打码</label>
      <label class="chk"><input type="checkbox" id="invert"> 反向筛选</label>
      <label class="chk"><input type="checkbox" id="skipMissing" checked> 缺列行丢弃</label>
      <label class="chk"><input type="checkbox" id="keepEmpty"> 保留空行</label>
      <label class="chk"><input type="checkbox" id="autoRun"> 输入时自动筛选</label>
    </div>
    <div class="actions">
      <button id="run" class="btn primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 2px;"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"></path><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"></path></svg>
        开始筛选
      </button>
      <label id="importBtn" class="btn" title="支持 .txt / .csv / .log / .tsv" style="position: relative; overflow: hidden;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
        导入文档
        <input id="fileInput" type="file" accept=".txt,.csv,.log,.tsv,text/plain,text/csv" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10; font-size: 0;">
      </label>
      <button id="exportBtn" class="btn" title="将筛选结果导出为 .txt 文件">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        导出结果
      </button>
      <button id="copy" class="btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        复制结果
      </button>
      <button id="clear" class="btn ghost">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        清空
      </button>
      <button id="demo" class="btn ghost">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path><path d="M5 3v4"></path><path d="M19 17v4"></path><path d="M3 5h4"></path><path d="M17 19h4"></path></svg>
        载入示例
      </button>
      <span id="stat" class="stat"></span>
    </div>
    <div id="msg" class="msg"></div>
    <div class="tips">
      规则示例（点击可填入）：
      <code class="ex">两个字</code> <code class="ex">阿拉伯数字</code> <code class="ex">手机号</code>
      <code class="ex">邮箱</code> <code class="ex">三个字 或 手机号</code> <code class="ex">包含:祁</code>
      <code class="ex">等于:祁仝</code> <code class="ex">re:^祁仝$</code>
    </div>
  </section>
  <section class="cols">
    <div class="card">
      <div class="head"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>原始数据</span><span id="inCount" class="muted">0 行</span></div>
      <div class="stat-chips" id="inStats"></div>
      <textarea id="input" spellcheck="false" placeholder="每行一条，列之间用分隔符（默认 ----）隔开"></textarea>
    </div>
    <div class="card">
      <div class="head"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>筛选结果</span><span id="outCount" class="muted">0 行</span></div>
      <div class="stat-chips" id="outStats"></div>
      <textarea id="output" readonly spellcheck="false" placeholder="筛选结果会显示在这里"></textarea>
    </div>
  </section>
</div>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  /* ==================== 一、规则解析 ==================== */
  var CN_NUM = { '零': 0, '〇': 0, '一': 1, '二': 2, '两': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9, '十': 10 };
  
  function cn2int(s) { s = String(s).trim(); if (/^\d+$/.test(s)) return parseInt(s, 10); if (Object.prototype.hasOwnProperty.call(CN_NUM, s)) return CN_NUM[s]; return null; }
  function compileReg(src) { try { return new RegExp(src); } catch (e) { throw new Error('正则表达式无效：' + src + '（' + e.message + '）'); } }
  
  function parseOne(cond) {
    var c = String(cond).trim();
    c = c.replace(/^[（(【\[\{]+/, '').replace(/[）)】\]\}]+$/, '').trim();
    c = c.replace(/的(东西|值|内容|数据|行|列|文本|字符)$/, '').trim();
    c = c.replace(/的$/, '').trim();
    c = c.replace(/(内容|数据|值)$/, '').trim();
    if (!c) return null;
    
    var low = c.toLowerCase();
    if (low.indexOf('re:') === 0) { var p1 = compileReg(c.slice(3)); return function (v) { return p1.test(v); }; }
    if (low.indexOf('regex:') === 0) { var p2 = compileReg(c.slice(6)); return function (v) { return p2.test(v); }; }
    if (low.indexOf('包含:') === 0 || low.indexOf('contains:') === 0) { var t1 = c.slice(c.indexOf(':') + 1); return function (v) { return v.indexOf(t1) !== -1; }; }
    if (low.indexOf('等于:') === 0 || low.indexOf('equals:') === 0) { var t2 = c.slice(c.indexOf(':') + 1); return function (v) { return v === t2; }; }
    if (c === '阿拉伯数字' || c === '纯数字' || c === '数字' || low === 'digits' || low === 'number') { return function (v) { return /^\d+$/.test(v); }; }
    if (c.indexOf('手机') !== -1 || low === 'phone') { return function (v) { return /^1[3-9]\d{9}$/.test(v); }; }
    if (c.indexOf('邮箱') !== -1 || low === 'email') { return function (v) { return /^[\w.+-]+@[\w-]+\.[\w.-]+$/.test(v); }; }
    var m = c.match(/^([一二两三四五六七八九十\d]+)\s*个?\s*字$/);
    if (m) { var n = cn2int(m[1]); if (n !== null && n > 0) { return function (v) { return Array.from(v).length === n; }; } }
    return function (v) { return v.indexOf(c) !== -1; };
  }

  function buildMatcher(rule) {
    if (typeof rule === 'function') return rule;
    if (rule instanceof RegExp) return function (v) { return rule.test(v); };
    if (typeof rule !== 'string') throw new TypeError('规则类型不支持');
    var raw = rule.trim(); if (!raw) return function () { return false; };
    if (/^(re:|regex:)/i.test(raw)) { var single = parseOne(raw); return single || function () { return false; }; }
    var base = raw.replace(/[（(【\[]/g, ' ').replace(/[）)】\]]/g, ' ');
    var parts = base.split(/或者|或|、|,/).map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });
    var fns = []; for (var i = 0; i < parts.length; i++) { var f = parseOne(parts[i]); if (f) fns.push(f); }
    if (fns.length === 0) return function () { return false; };
    if (fns.length === 1) return fns[0];
    return function (v) { for (var j = 0; j < fns.length; j++) { if (fns[j](v)) return true; } return false; };
  }

  /* ==================== 二、主筛选函数 ==================== */
  function smartFilter(lines, column, rule, opts) {
    opts = opts || {};
    var delim = (opts.delim === undefined || opts.delim === '') ? '----' : opts.delim;
    var mask = (opts.mask === undefined) ? null : opts.mask;
    var invert = !!opts.invert, skipMissing = opts.skipMissing !== false, keepEmpty = !!opts.keepEmpty;
    var col = Number(column); if (!Number.isInteger(col) || col < 1) throw new Error('列号必须是大于等于 1 的整数');
    var idx = col - 1, matcher = buildMatcher(rule), out = [], total = 0, hit = 0, missing = 0;
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (line.length && line.charCodeAt(line.length - 1) === 13) line = line.slice(0, -1);
      if (!line.trim()) { if (keepEmpty) out.push(line); continue; }
      total++;
      var parts = line.split(delim);
      if (idx >= parts.length) { missing++; if (skipMissing) continue; if (invert) out.push(line); continue; }
      var val = parts[idx].trim(), ok = matcher(val); if (invert) ok = !ok;
      if (ok) { hit++; if (mask !== null && mask !== undefined) parts[idx] = mask; out.push(parts.join(delim)); }
    }
    return { lines: out, total: total, hit: hit, missing: missing };
  }

  /* ==================== 三、统计工具 ==================== */
  var DEFAULT_DELIM = '----';
  function getDelim() { var d = $('delim').value; return d === '' ? DEFAULT_DELIM : d; }
  function analyzeText(text, delim) {
    var res = { rows: 0, nonEmpty: 0, colsMin: 0, colsMax: 0, cells: 0, chars: 0 }; if (!text) return res;
    res.chars = text.length; var lines = text.split(/\r?\n/); res.rows = lines.length;
    var cMin = Infinity, cMax = 0, cells = 0, nonEmpty = 0;
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i]; if (ln.length && ln.charCodeAt(ln.length - 1) === 13) ln = ln.slice(0, -1);
      if (!ln.trim()) continue; nonEmpty++; var n = ln.split(delim).length;
      if (n < cMin) cMin = n; if (n > cMax) cMax = n; cells += n;
    }
    if (cMin === Infinity) cMin = 0;
    res.nonEmpty = nonEmpty; res.colsMin = cMin; res.colsMax = cMax; res.cells = cells; return res;
  }
  function fmtNum(n) { return Number(n || 0).toLocaleString('zh-CN'); }
  function colsLabel(a) { if (!a.colsMax) return '0'; if (a.colsMin === a.colsMax) return String(a.colsMax); return a.colsMin + '~' + a.colsMax; }
  function chip(k, v, tone) { return '<span class="stat-chip' + (tone ? ' ' + tone : '') + '"><span class="k">' + k + '</span><b>' + v + '</b></span>'; }
  
  function updateInputStats() {
    try {
      var text = $('input').value, a = analyzeText(text, getDelim()), html = '';
      html += chip('总行数', fmtNum(a.rows)); html += chip('有效行', fmtNum(a.nonEmpty)); html += chip('列数', colsLabel(a)); html += chip('总字符', fmtNum(a.chars));
      $('inStats').innerHTML = html; $('inCount').textContent = fmtNum(a.rows) + ' 行 · ' + colsLabel(a) + ' 列';
    } catch (e) { $('inStats').innerHTML = ''; }
  }
  
  function updateOutputStats(res, outText) {
    if (!res) { $('outStats').innerHTML = ''; $('outCount').textContent = '0 行'; return; }
    var a = analyzeText(outText || '', getDelim()), rate = res.total > 0 ? (res.hit / res.total * 100) : 0;
    var rateStr = rate === 0 ? '0%' : (rate < 10 ? rate.toFixed(1) : rate.toFixed(0)) + '%';
    var html = ''; html += chip('结果行', fmtNum(res.lines.length), res.lines.length ? 'ok' : 'bad'); html += chip('列数', colsLabel(a), 'info'); html += chip('命中率', rateStr, 'info'); html += chip('过滤行', fmtNum(res.total - res.hit), 'warn');
    $('outStats').innerHTML = html; $('outCount').textContent = fmtNum(res.lines.length) + ' 行 · ' + colsLabel(a) + ' 列';
  }

  var DEMO = '18979625195----991385468----901908322----祁仝----18979625195q----实名\nabc----123----456----张三----x@x.com----匿名\n13800138000----111----222----李四----y@y.com----实名';
  
  function showMsg(text, type) { var el = $('msg'); el.className = 'msg' + (type ? ' ' + type : ''); el.textContent = text || ''; }
  
  function run() {
    try {
      var rawText = $('input').value, lines = rawText.length ? rawText.split(/\r?\n/) : [], col = parseInt($('col').value, 10);
      if (!Number.isInteger(col) || col < 1) throw new Error('列号必须是大于等于 1 的整数');
      var delim = $('delim').value; if (delim === '') delim = '----';
      var rule = $('rule').value; if (!rule.trim()) throw new Error('请填写筛选规则');
      var useMask = $('useMask').checked, maskVal = $('mask').value;
      if (useMask && maskVal === '') throw new Error('已启用打码，但"命中列替换为"为空');
      
      var res = smartFilter(lines, col, rule, { delim: delim, mask: useMask ? maskVal : null, invert: $('invert').checked, skipMissing: $('skipMissing').checked, keepEmpty: $('keepEmpty').checked });
      var outText = res.lines.join('\n'); $('output').value = outText;
      var filtered = res.total - res.hit, stat = '共 <b>' + res.total + '</b> 行 · 命中 <b style="color:#10b981">' + res.hit + '</b> 行 · 过滤 <b style="color:#ef4444">' + filtered + '</b> 行';
      if (res.missing) stat += ' · 缺列 <b>' + res.missing + '</b> 行'; $('stat').innerHTML = stat;
      updateOutputStats(res, outText); updateInputStats();
      
      if (res.lines.length === 0) showMsg('没有命中任何行，请检查规则或列号。', 'err'); else { showMsg('', ''); $('msg').className = 'msg'; $('msg').textContent = ''; }
    } catch (e) {
      $('stat').innerHTML = ''; $('output').value = ''; updateOutputStats(null); showMsg('❌ ' + e.message, 'err');
    }
  }

  $('run').addEventListener('click', run);
  
  $('copy').addEventListener('click', function () {
    var txt = $('output').value; if (!txt) { showMsg('结果为空，没有可复制的内容。', 'err'); return; }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(txt).then(function () { showMsg('✅ 已复制 ' + $('output').value.split('\n').length + ' 行到剪贴板。', 'ok'); }).catch(function () { fallbackCopy(txt); });
    } else { fallbackCopy(txt); }
  });
  
  function fallbackCopy(txt) {
    var ta = $('output'); ta.removeAttribute('readonly'); ta.select(); var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.setAttribute('readonly', 'readonly'); window.getSelection().removeAllRanges();
    if (ok) showMsg('✅ 已复制到剪贴板。', 'ok'); else showMsg('❌ 复制失败，请手动选中复制。', 'err');
  }
  
  $('clear').addEventListener('click', function () {
    $('input').value = ''; $('output').value = ''; $('stat').innerHTML = ''; updateCounts(0, 0); updateInputStats(); updateOutputStats(null);
    $('msg').className = 'msg'; $('msg').textContent = '';
    if (window.IO && IO.clearFx) IO.clearFx('清空成功');
  });
  
  function updateCounts(inN, outN) { $('inCount').textContent = inN + ' 行'; $('outCount').textContent = outN + ' 行'; }
  
  $('demo').addEventListener('click', function () {
    $('input').value = DEMO; $('col').value = '1'; $('delim').value = '----'; $('rule').value = '两个字 或 阿拉伯数字'; $('mask').value = 'xx'; $('useMask').checked = true; $('invert').checked = false; $('skipMissing').checked = true; $('keepEmpty').checked = false; run();
  });

  function safeDecode(bytes, enc) { try { return new TextDecoder(enc).decode(bytes); } catch (e) { return new TextDecoder('utf-8').decode(bytes); } }
  function decodeBuffer(buf) {
    var bytes = new Uint8Array(buf), len = bytes.length;
    if (len >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) return safeDecode(bytes.subarray(3), 'utf-8');
    if (len >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) return safeDecode(bytes.subarray(2), 'utf-16le');
    if (len >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF) return safeDecode(bytes.subarray(2), 'utf-16be');
    try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes); } catch (e) { }
    try { return new TextDecoder('gb18030').decode(bytes); } catch (e2) { }
    return new TextDecoder('utf-8').decode(bytes);
  }

  $('fileInput').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0]; if (!file) { e.target.value = ''; return; }
    var inputEl = e.target, sizeMB = file.size / 1024 / 1024;

    function readFile() {
      var sizeText = sizeMB < 1 ? (file.size / 1024).toFixed(1) + ' KB' : sizeMB.toFixed(2) + ' MB';
      showMsg('📖 正在读取：' + file.name + '（' + sizeText + '）...', 'info');
      var reader = new FileReader();

      reader.onload = function (ev) {
        inputEl.value = '';
        try {
          var result = ev.target.result, text = typeof result === 'string' ? result : decodeBuffer(result);
          if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
          var lineCount = text ? text.split(/\r?\n/).length : 0;
          showMsg('⏳ 正在渲染 ' + fmtNum(lineCount) + ' 行到编辑器...', 'info');
          setTimeout(function () {
            if (window.NB && NB.rememberImport) NB.rememberImport(file.name, null, file.size);
            $('input').value = text; $('output').value = ''; $('stat').innerHTML = ''; updateInputStats(); updateOutputStats(null);
            if ($('autoRun').checked) run(); else showMsg('✅ 已导入 ' + fmtNum(lineCount) + ' 行，点击"开始筛选"或 Ctrl+Enter 执行。', 'ok');
          }, 30);
        } catch (err) { showMsg('❌ 处理文件出错：' + err.message, 'err'); }
      };

      reader.onerror = function () { inputEl.value = ''; showMsg('❌ 读取文件失败，请检查文件是否可读。', 'err'); };
      if (typeof TextDecoder === 'undefined') reader.readAsText(file, 'UTF-8'); else reader.readAsArrayBuffer(file);
    }

    if (sizeMB > 200) {
      inputEl.value = '';
      IO.confirm({
        title: '导入大文件？',
        text: '文件约 ' + sizeMB.toFixed(1) + ' MB，导入和渲染可能较慢，但不会上传。',
        okText: '继续导入',
        onOk: readFile
      });
      return;
    }
    readFile();
  });

  // 系统文件面板导入：记住句柄，导出时可覆盖原文件
  $('importBtn').addEventListener('click', function (e) {
    if (!(window.NB && NB.upload)) return;
    e.preventDefault();
    NB.upload({
      accept: '.txt,.csv,.log,.tsv,text/plain,text/csv',
      onText: function (text, file) {
        $('input').value = text;
        $('output').value = '';
        $('stat').innerHTML = '';
        updateInputStats(); updateOutputStats(null);
        if ($('autoRun').checked) run();
        else showMsg('✅ 已导入 ' + fmtNum(text ? text.split(/\r?\n/).length : 0) + ' 行，点击“开始筛选”执行。', 'ok');
      }
    });
  });

  // 统一导出：可改文件名、可覆盖导入的原文件
  $('exportBtn').addEventListener('click', function () {
    var txt = $('output').value;
    if (!txt) { showMsg('结果为空，没有可导出的内容。', 'err'); return; }
    var last = window.NB && NB.lastImport && NB.lastImport();
    NB.exportDialog({
      text: txt,
      name: last && last.name ? NB.stripExt(last.name) : '筛选结果',
      ext: 'txt',
      meta: txt.split(/\r?\n/).length + ' 行'
    });
  });

  var exList = document.querySelectorAll('.tips .ex');
  for (var i = 0; i < exList.length; i++) { (function (el) { el.addEventListener('click', function () { $('rule').value = el.textContent; if ($('autoRun').checked) scheduleAutoRun(); }); })(exList[i]); }
  
  var autoTimer = null;
  function scheduleAutoRun() { if (!$('autoRun').checked) return; if (autoTimer) clearTimeout(autoTimer); autoTimer = setTimeout(function () { autoTimer = null; if (!$('input').value.trim()) return; run(); }, 250); }
  $('input').addEventListener('input', function () { updateInputStats(); scheduleAutoRun(); });
  
  var watchIds = ['col', 'delim', 'rule', 'mask'];
  for (var w = 0; w < watchIds.length; w++) { (function (el) { el.addEventListener('input', function () { if (el.id === 'delim') updateInputStats(); scheduleAutoRun(); }); })($(watchIds[w])); }
  var watchChk = ['useMask', 'invert', 'skipMissing', 'keepEmpty'];
  for (var c = 0; c < watchChk.length; c++) { (function (el) { el.addEventListener('change', scheduleAutoRun); })($(watchChk[c])); }
  
  document.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); } });
  updateInputStats();
})();
</script>
<script src="lib-io.js"></script>
<script src="app-core.js"></script>
<script src="tool-skin.js"></script>
<script src="v9-upgrade.js"></script>
</body>
